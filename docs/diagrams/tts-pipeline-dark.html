<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS pipeline · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    .step-number, .step-label, .role-text, .chip-text, .arrow-label { font-family: var(--font-mono); text-anchor: middle; }
    .legend-label { font-family: var(--font-mono); }
    .step-number { fill: var(--color-ink); font-size: 8px; font-weight: 600; }
    .step-label { fill: var(--color-muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--color-ink); font-size: 8px; font-weight: 600; letter-spacing: 0.08em; }
    .focal-text { fill: var(--color-accent); }
    .arrow-label { font-size: 8px; font-weight: 400; letter-spacing: 0.06em; }
    .node-title { fill: var(--color-ink); font: 600 12px var(--font-sans); text-anchor: middle; }
    .node-sub { fill: var(--color-muted); font: 400 9px var(--font-mono); text-anchor: middle; }
    .node-tool { fill: #8e98ac; font: 400 9px var(--font-mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 7px; font-weight: 700; }
    .legend-label { fill: var(--color-muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .legend-text { fill: var(--color-muted); font: 400 10px var(--font-sans); }

    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · TTS App</p>
    <h1>From text to speech, all on your machine</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tts-pipeline-dark-title tts-pipeline-dark-desc">
        <title id="tts-pipeline-dark-title">TTS App pipeline</title>
        <desc id="tts-pipeline-dark-desc">Text from the editor, a file or the clipboard hotkey is prepared, spoken by Supertonic, Piper or SAPI5, optionally converted by RVC, then played or saved.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#2d3142"/>
        <line x1="0" y1="40" x2="960" y2="40" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="580" x2="960" y2="580" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <rect x="80" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/>
        <text x="96" y="17" class="step-number">01</text>
        <text x="96" y="34" class="step-label">CAPTURE</text>
        <rect x="272" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/>
        <text x="288" y="17" class="step-number">02</text>
        <text x="288" y="34" class="step-label">PREP</text>
        <rect x="464" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/>
        <text x="480" y="17" class="step-number">03</text>
        <text x="480" y="34" class="step-label">SYNTHESIZE</text>
        <rect x="656" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/>
        <text x="672" y="17" class="step-number">04</text>
        <text x="672" y="34" class="step-label">CONVERT</text>
        <rect x="848" y="6" width="32" height="16" rx="8" fill="rgba(245,245,245,0.12)"/>
        <text x="864" y="17" class="step-number">05</text>
        <text x="864" y="34" class="step-label">OUTPUT</text>
        <path d="M96 148 V188" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M160 236 H224" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M352 212 H416" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M352 236 H384 Q392 236 392 244 V364 Q392 372 400 372 H416" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M352 260 H364 Q372 260 372 268 V500 Q372 508 380 508 H416" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M544 236 H856 Q864 236 864 244 V324" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M544 372 H608" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M736 372 H800" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M480 420 V432 Q480 440 488 440 H836 Q844 440 844 432 V420" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M544 508 H876 Q884 508 884 500 V420" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="550" y="350" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="576" y="359" class="arrow-label" fill="#f08a59">OPTIONAL</text>
        <rect x="624" y="448" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="660" y="457" class="arrow-label" fill="#bfc0c0">WITHOUT RVC</text>
        <g aria-label="Hotkey · Tray">
          <rect x="32" y="52" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="32" y="52" width="128" height="96" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac"/>
          <rect x="40" y="60" width="28" height="12" rx="2" fill="rgba(245,245,245,0.12)"/><text x="54" y="69" class="role-text ">IN</text>
          <text x="96" y="92" class="node-title">Hotkey · Tray</text>
          <text x="96" y="108" class="node-sub">clipboard text</text>
          <text x="96" y="122" class="node-tool">Ctrl+Alt+S · tray</text>
          <rect x="128" y="128" width="24" height="12" rx="3" fill="#82a0c0"/><text x="140" y="137" class="chip-text">TX</text>
        </g>
        <g aria-label="Editor">
          <rect x="32" y="188" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="32" y="188" width="128" height="96" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac"/>
          <rect x="40" y="196" width="28" height="12" rx="2" fill="rgba(245,245,245,0.12)"/><text x="54" y="205" class="role-text ">IN</text>
          <text x="96" y="228" class="node-title">Editor</text>
          <text x="96" y="244" class="node-sub">typed · pasted</text>
          <text x="96" y="258" class="node-tool">.txt .tsv .docx</text>
          <rect x="128" y="264" width="24" height="12" rx="3" fill="#82a0c0"/><text x="140" y="273" class="chip-text">TX</text>
        </g>
        <g aria-label="Text prep">
          <rect x="224" y="188" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="224" y="188" width="128" height="96" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)"/>
          <rect x="232" y="196" width="28" height="12" rx="2" fill="rgba(245,245,245,0.12)"/><text x="246" y="205" class="role-text ">TXT</text>
          <text x="288" y="228" class="node-title">Text prep</text>
          <text x="288" y="244" class="node-sub">split · table rows</text>
          <text x="288" y="258" class="node-tool">segment · tables</text>
          <rect x="232" y="264" width="24" height="12" rx="3" fill="#82a0c0"/><text x="244" y="273" class="chip-text">TX</text>
          <rect x="320" y="264" width="24" height="12" rx="3" fill="#82a0c0"/><text x="332" y="273" class="chip-text">TX</text>
        </g>
        <g aria-label="Supertonic">
          <rect x="416" y="188" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="416" y="188" width="128" height="96" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)"/>
          <rect x="424" y="196" width="28" height="12" rx="2" fill="rgba(245,245,245,0.12)"/><text x="438" y="205" class="role-text ">TTS</text>
          <text x="480" y="228" class="node-title">Supertonic</text>
          <text x="480" y="244" class="node-sub">neural ONNX · CPU</text>
          <text x="480" y="258" class="node-tool">10 voices</text>
          <rect x="424" y="264" width="24" height="12" rx="3" fill="#82a0c0"/><text x="436" y="273" class="chip-text">TX</text>
          <rect x="512" y="264" width="24" height="12" rx="3" fill="#6fa383"/><text x="524" y="273" class="chip-text">PCM</text>
        </g>
        <g aria-label="Piper">
          <rect x="416" y="324" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="416" y="324" width="128" height="96" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)"/>
          <rect x="424" y="332" width="28" height="12" rx="2" fill="rgba(245,245,245,0.12)"/><text x="438" y="341" class="role-text ">TTS</text>
          <text x="480" y="364" class="node-title">Piper</text>
          <text x="480" y="380" class="node-sub">neural ONNX · CPU</text>
          <text x="480" y="394" class="node-tool">piper-tts · exe</text>
          <rect x="424" y="400" width="24" height="12" rx="3" fill="#82a0c0"/><text x="436" y="409" class="chip-text">TX</text>
          <rect x="512" y="400" width="24" height="12" rx="3" fill="#6fa383"/><text x="524" y="409" class="chip-text">PCM</text>
        </g>
        <g aria-label="SAPI5">
          <rect x="416" y="460" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="416" y="460" width="128" height="96" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)"/>
          <rect x="424" y="468" width="28" height="12" rx="2" fill="rgba(245,245,245,0.12)"/><text x="438" y="477" class="role-text ">TTS</text>
          <text x="480" y="500" class="node-title">SAPI5</text>
          <text x="480" y="516" class="node-sub">Windows built-in</text>
          <text x="480" y="530" class="node-tool">pyttsx3 fallback</text>
          <rect x="424" y="536" width="24" height="12" rx="3" fill="#82a0c0"/><text x="436" y="545" class="chip-text">TX</text>
          <rect x="512" y="536" width="24" height="12" rx="3" fill="#6fa383"/><text x="524" y="545" class="chip-text">PCM</text>
        </g>
        <g aria-label="RVC convert">
          <rect x="608" y="324" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="608" y="324" width="128" height="96" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.2"/>
          <rect x="616" y="332" width="28" height="12" rx="2" fill="rgba(240,138,89,0.22)"/><text x="630" y="341" class="role-text focal-text">VC</text>
          <text x="672" y="364" class="node-title">RVC convert</text>
          <text x="672" y="380" class="node-sub">voice conversion</text>
          <text x="672" y="394" class="node-tool">torch · CUDA/CPU</text>
          <rect x="616" y="400" width="24" height="12" rx="3" fill="#6fa383"/><text x="628" y="409" class="chip-text">PCM</text>
          <rect x="704" y="400" width="24" height="12" rx="3" fill="#6fa383"/><text x="716" y="409" class="chip-text">PCM</text>
        </g>
        <g aria-label="Play · Save">
          <rect x="800" y="324" width="128" height="96" rx="6" fill="#2d3142"/>
          <rect x="800" y="324" width="128" height="96" rx="6" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)"/>
          <rect x="808" y="332" width="28" height="12" rx="2" fill="rgba(245,245,245,0.12)"/><text x="822" y="341" class="role-text ">OUT</text>
          <text x="864" y="364" class="node-title">Play · Save</text>
          <text x="864" y="380" class="node-sub">QAudioSink</text>
          <text x="864" y="394" class="node-tool">WAV · MP3 · OGG</text>
          <rect x="808" y="400" width="24" height="12" rx="3" fill="#6fa383"/><text x="820" y="409" class="chip-text">PCM</text>
          <rect x="896" y="400" width="24" height="12" rx="3" fill="#b88670"/><text x="908" y="409" class="chip-text">FL</text>
        </g>
        <text x="32" y="606" class="legend-label">NODE</text>
        <rect x="84" y="596" width="20" height="12" rx="3" fill="rgba(191,192,192,0.10)" stroke="#8e98ac"/><text x="112" y="606" class="legend-text">Entry point</text>
        <rect x="212" y="596" width="20" height="12" rx="3" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)"/><text x="240" y="606" class="legend-text">Pipeline stage</text>
        <rect x="360" y="596" width="20" height="12" rx="3" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.2"/><text x="388" y="606" class="legend-text">Optional RVC stage</text>
        <text x="560" y="606" class="legend-label">FLOW</text>
        <line x1="604" y1="602" x2="632" y2="602" stroke="#bfc0c0" marker-end="url(#arrow)"/><text x="644" y="606" class="legend-text">Handoff</text>
        <line x1="720" y1="602" x2="748" y2="602" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text x="760" y="606" class="legend-text">Voice conversion</text>
        <text x="32" y="634" class="legend-label">DATA</text>
        <rect x="84" y="624" width="24" height="12" rx="3" fill="#82a0c0"/><text x="96" y="633" class="chip-text">TX</text><text x="116" y="634" class="legend-text">Text</text>
        <rect x="168" y="624" width="24" height="12" rx="3" fill="#6fa383"/><text x="180" y="633" class="chip-text">PCM</text><text x="200" y="634" class="legend-text">Audio (PCM)</text>
        <rect x="296" y="624" width="24" height="12" rx="3" fill="#b88670"/><text x="308" y="633" class="chip-text">FL</text><text x="328" y="634" class="legend-text">Audio file</text>
        <text x="420" y="634" class="legend-text">left chip = input · right chip = output</text>
      </svg>
    </div>
  </div>
</body>
</html>
