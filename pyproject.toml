[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-app"
version = "0.1.0"
description = "Local-first text-to-speech desktop app for Windows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Aaron Karsten" }]
dependencies = [
    "PySide6>=6.7",       # Qt6 GUI toolkit — primary UI framework
    "piper-tts>=1.4",     # neural TTS engine (invoked as subprocess to keep app MIT)
    "pyttsx3>=2.90",      # SAPI5 fallback engine, zero-config on Windows
    "comtypes==1.2.1",    # pyttsx3 dep — pin to avoid the 1.4 SpeechLib codegen bug
    "keyboard>=0.13",     # global hotkey on Windows, no admin needed
    "platformdirs>=4",    # %APPDATA% path resolution
    "pydantic>=2",        # config schema validation
    "pydub>=0.25",        # WAV/MP3/OGG encoding (calls bundled ffmpeg.exe)
    "audioop-lts>=0.2; python_version >= '3.13'",  # pydub still imports audioop (gone in 3.13)
    "numpy>=1.24",        # PCM decoding/resampling for engine output
    "requests>=2.31",     # Piper voice catalog + voice file downloader
]

[project.optional-dependencies]
supertonic = [
    "supertonic>=1.3",    # optional neural engine; fetches its model on first use
]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
tts-app = "tts_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tts_app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
# No python_version pin: check against the running interpreter. Pinning 3.11
# breaks on 3.13, where numpy's stubs use 3.12+ syntax.
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Optional or untyped third-party packages.
[[tool.mypy.overrides]]
module = ["supertonic.*", "torch.*", "rvc_inferpy.*", "imageio_ffmpeg.*", "pydub.*"]
ignore_missing_imports = true
